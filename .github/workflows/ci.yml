name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    # Job names are referenced by branch protection (docs/STAGING.md). Keep them stable.
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI never talks to a hosted Supabase project. These placeholder values point at
    # the local stack's address so `next build` has every key it reads. There is no
    # .env.local in CI, so nothing else can fill them in.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      MUSICBRAINZ_USER_AGENT: earwrm-ci/0.0.0 ( https://github.com/vishnumadhav108/earwrm )
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  db:
    # Migrations, generated types and pgTAP, against a fresh local Supabase stack in the
    # runner. No hosted project is involved, and the job has no Supabase secrets. Every
    # database command runs through scripts/db/target.mjs in local mode.
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # The pinned CLI comes from node_modules (supabase 3.0.0 in package-lock.json), the
      # same binary used locally. No setup-cli action needed.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,vector

      - name: Apply every migration to a fresh database (+ seed)
        run: npm run db:reset

      - name: Migrations - clean build vs legacy upgrade
        run: npm run verify:migrations

      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/data/database.types.ts || {
            echo "::error::src/data/database.types.ts is stale. Run 'npm run db:types' and commit the result."
            exit 1
          }

      - name: pgTAP
        run: npm run test:db

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # Fails if Vitest executes zero tests (scripts/test-unit.mjs).
      - name: Vitest
        run: npm test

  e2e:
    # The full acceptance path on a fresh local stack: `npm run check` (typecheck, lint,
    # unit, pgTAP, build:local) and then Playwright against /demo and local Supabase. No
    # hosted project, no secrets. Outside requests (MusicBrainz, etc.) are blocked
    # inside the tests.
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,vector

      - name: Write the local-stack env
        run: npm run env:local

      - name: Apply every migration to a fresh database (+ seed)
        run: npm run db:reset

      - name: npm run check
        run: npm run check

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      # Preview guard: a build with the guard on must act as the demo only, and neither the
      # browser nor the Next.js server may reach Supabase (a local tripwire counts requests).
      - name: Playwright (preview guard)
        run: npm run test:e2e:guard

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            playwright-report-guard/
            test-results-guard/
          retention-days: 3

  release-order:
    # Always reports a status. Fails when a PR adds a migration together with anything
    # outside the allowlist, or edits/deletes a merged migration. It can't prove the
    # production migration was applied: that stays a manual PR checklist item.
    name: Release order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check release order
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/release-order.mjs "origin/${{ github.base_ref }}"
          else
            echo "[release-order] push to ${{ github.ref_name }}: nothing to compare (checked on the PR)."
          fi
