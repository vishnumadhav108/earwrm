name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    # Job names are referenced by branch protection (docs/STAGING.md). Keep them stable.
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CI never talks to a hosted Supabase project. These placeholder values point at
    # the local stack's address so `next build` has every key it reads. There is no
    # .env.local in CI, so nothing else can fill them in.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      MUSICBRAINZ_USER_AGENT: earwrm-ci/0.0.0 ( https://github.com/vishnumadhav108/earwrm )
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
